<div id="screen-dashboard" class="container mx-auto p-6 hidden flex-col md:flex-row gap-6 mt-10 justify-center">
        <button id="btn-donor-dashboard" onclick="showScreen('donor')" class="bg-white p-10 rounded-xl shadow-lg hover:shadow-xl transition border-t-4 border-green-500 w-full md:w-1/2 text-center hidden">
            <h2 class="text-xl font-bold mb-2">Donate Food</h2>

        </button>

        <button id="btn-ngo-dashboard" onclick="loginAsNGO()" class="bg-white p-10 rounded-xl shadow-lg hover:shadow-xl transition border-t-4 border-blue-500 w-full md:w-1/2 text-center hidden">
            <h2 class="text-xl font-bold mb-2">Claim Food</h2>

    <div id="screen-donor" class="container mx-auto p-6 hidden max-w-lg mt-6">

            </select>
            <input type="number" id="quantity" placeholder="Quantity (No. of people)" class="w-full mb-3 p-2 border rounded">
            <input type="datetime-local" id="prepTime" class="w-full mb-3 p-2 border rounded">
            
            <div class="flex gap-2 mb-3">
                <input type="text" id="location" value="25.4358, 81.8463" placeholder="Lat, Lon" class="w-full p-2 border rounded bg-gray-100" readonly>
                <button type="button" onclick="detectDonorLocation()" class="bg-gray-200 px-3 rounded hover:bg-gray-300">Auto-Detect</button>
            </div>
            
            <div id="shelfLifeWindow" class="bg-yellow-100 border-l-4 border-yellow-500 p-3 mb-4 text-sm hidden">
                <span class="font-bold">AI Estimate:</span> <span id="estimateText">Processing...</span>
            </div>

            <button onclick="broadcastFood()" class="w-full bg-green-600 text-white p-3 rounded font-bold hover:bg-green-700 transition">Broadcast to Nearest NGOs</button>
        </div>
    </div>

    <div id="screen-ngo" class="container mx-auto p-6 hidden mt-6 flex flex-col lg:flex-row gap-6">

        </div>
        <div class="w-full lg:w-2/3 bg-white p-2 rounded-xl shadow-lg">
            <div id="map" class="w-full h-[500px] rounded bg-gray-200"></div>
        </div>
    </div>

    <footer class="fixed bottom-0 w-full bg-gray-900 text-white p-3 text-center text-sm">
        <span class="font-bold text-green-400">Total Food Saved: <span id="statsKg">0</span> Kgs</span> | 
        <span class="font-bold text-blue-400">Meals Served: <span id="statsMeals">0</span></span>
    </footer>

    <script>
        const socket = io('https://aahar-ai-xs0e.onrender.com');
        let map;

        function showScreen(screen) {
            document.getElementById('screen-dashboard').classList.add('hidden');
            document.getElementById('screen-donor').classList.add('hidden');
            document.getElementById('screen-ngo').classList.add('hidden');
            document.getElementById(`screen-${screen}`).classList.remove('hidden');
        }

        // Mock Login for NGO to register socket
        // Login for NGO to register socket and load map at their real location
function loginAsNGO() {
    showScreen('ngo');

    // Check if the browser supports geolocation
    if (navigator.geolocation) {
        // Ask the user for their current location
        navigator.geolocation.getCurrentPosition(
            (position) => {
                // Success: Get the real latitude and longitude
                const lat = position.coords.latitude;
                const lon = position.coords.longitude;

                // 1. Register the NGO with their REAL coordinates
                socket.emit('register_ngo', { id: "NGO_LIVE_01", coords: [lat, lon] });

                // 2. Initialize the map at their real location
                setTimeout(() => {
                    if (!map) {
                        map = L.map('map').setView([lat, lon], 13);
                        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
                    } else {
                        map.setView([lat, lon], 13);
                    }
                    
                    // Optional: Drop a blue pin to show them where they are
                    L.marker([lat, lon]).addTo(map).bindPopup("You are here").openPopup();
                }, 500);
            },
            (error) => {
                // Error/Denied: Fallback to the default coordinates if they click "Block"
                console.warn("Location access denied or failed. Using fallback.", error);
                
                socket.emit('register_ngo', { id: "NGO_TEST_01", coords: [25.4358, 81.8463] });
                
                setTimeout(() => {
                    if (!map) {
                        map = L.map('map').setView([25.4358, 81.8463], 12);
                        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
                    }
                }, 500);
            }
        );
    } else {
        alert("Geolocation is not supported by this browser.");
    }
}
// Auto-detect donor location
function detectDonorLocation() {
    const locationInput = document.getElementById('location');
    locationInput.value = "Detecting..."; // Show loading state

    if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
            (position) => {
                // Rounding to 4 decimal places for clean UI
                const lat = position.coords.latitude.toFixed(4);
                const lon = position.coords.longitude.toFixed(4);
                locationInput.value = `${lat}, ${lon}`;
            },
            (error) => {
                console.warn("Location access denied.", error);
                alert("Could not detect location. Make sure location permissions are allowed.");
                locationInput.value = "25.4358, 81.8463"; // Revert to fallback
            }
        );
    } else {
        alert("Geolocation is not supported by this browser.");
    }
}

        // Broadcast Food
async function broadcastFood() {
    const locString = document.getElementById('location').value;
    const coordsArray = locString.split(',').map(coord => parseFloat(coord.trim()));
    const lat = coordsArray[0];
    const lon = coordsArray[1];
    let realTemp = 35.0;
    try {
        const weatherRes = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true`);
        if (weatherRes.ok) {
            const weatherData = await weatherRes.json();
            realTemp = weatherData.current_weather.temperature;
            console.log(`Live temperature fetched: ${realTemp}°C`);
        }
    } catch (err) {
        console.warn("Could not fetch live weather, using fallback temperature.", err);
    }
    const data = {
        foodType: document.getElementById('foodType').value,
        quantity: document.getElementById('quantity').value,
        prepTime: document.getElementById('prepTime').value.replace('T', ' '),
        currentTemp: realTemp,
        donorCoords: coordsArray // Now uses the detected location
    };

    try {
        const res = await fetch('https://aahar-ai-xs0e.onrender.com/api/donations/broadcast', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(data)
        });

        const resultData = await res.json();

        if (res.ok) {
            alert("Food Broadcasted Successfully!");
        } else {
            // This will display "AI Warning: Food is spoiled" or "No NGOs found"
            alert("Broadcast Failed: " + resultData.error); 
        }
    } catch (err) {
        alert("Server error. Please wait a moment and try again.");
    }
}

        
        socket.on('new_food_alert', (data) => {
            const feedList = document.getElementById('feedList');
    
    if (feedList.innerHTML.includes('Waiting for broadcasted donations')) {
        feedList.innerHTML = ''; 
    }
           const feedHTML = `
        <div class="bg-white p-4 rounded shadow border-l-4 border-green-500 mb-4">
            <p class="font-bold">Donor has ${data.foodType} for ${data.quantity} people.</p>
            <p class="text-sm text-red-500">Freshness: ${data.shelfLife.remaining_hours} hours left</p>
           <button onclick="acceptDonation(this, ${data.routing.donor_coordinates[0]}, ${data.routing.donor_coordinates[1]})"
    class="mt-2 bg-blue-600 text-white px-3 py-1 rounded text-sm w-full hover:bg-blue-700 transition">Accept & View Route</button>
    </div>
    `;

    
    feedList.insertAdjacentHTML('beforeend', feedHTML);
});

        function acceptDonation(buttonElement, donorLat, donorLon) {
    // 1. Change the card UI to show it was accepted
    const card = buttonElement.parentElement;
    card.classList.replace('border-green-500', 'border-gray-300');
    card.classList.replace('bg-white', 'bg-gray-100');
    card.innerHTML = `
        <p class="font-bold text-green-700"> Donation Accepted!</p>
        <p class="text-sm text-gray-600">Navigating to pickup location...</p>
    `;

    // 2. Drop the Donor Pin
    const donorMarker = L.marker([donorLat, donorLon]).addTo(map).bindPopup('Pick Up Here').openPopup();

    // 3. Get the NGO's current location (the center of the map from when they logged in)
    const ngoLat = map.getCenter().lat;
    const ngoLon = map.getCenter().lng;

    // 4. Draw a visual route (line) between the NGO and the Donor
    const routeLine = L.polyline([
        [ngoLat, ngoLon], 
        [donorLat, donorLon]
    ], {
        color: 'blue',
        weight: 5,
        dashArray: '10, 10' // Makes it a cool dotted line
    }).addTo(map);

    // 5. Automatically zoom and pan the map so both the NGO and Donor fit perfectly on the screen
    map.fitBounds(routeLine.getBounds(), { padding: [50, 50] });
}

        // Load Stats
        fetch('https://aahar-ai-xs0e.onrender.com/api/stats')
            .then(r => r.json())
            .then(data => {
                document.getElementById('statsKg').innerText = data.foodSavedKg;

function showScreen(screen) {
    document.getElementById('screen-login').classList.add('hidden');
    document.getElementById('screen-register').classList.add('hidden');
    document.getElementById('screen-dashboard').classList.add('hidden');
    document.getElementById('screen-donor').classList.add('hidden');
    document.getElementById('screen-ngo').classList.add('hidden');
    
    document.getElementById(`screen-${screen}`).classList.remove('hidden');
    
    if(screen === 'dashboard') {
        document.getElementById('screen-dashboard').style.display = 'flex';
    } else {
        document.getElementById('screen-dashboard').style.display = '';
    }
}

// Register User
async function registerUser() {
    const data = {
        name: document.getElementById('regName').value,
        email: document.getElementById('regEmail').value,
        password: document.getElementById('regPassword').value,
        role: document.getElementById('regRole').value,
        coords: [25.4358, 81.8463]
    };

    const res = await fetch('https://aahar-ai-xs0e.onrender.com/api/auth/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
    });
    
    if (res.ok) {
        alert("Account created! You can now log in.");
        showScreen('login');
    } else {
        const result = await res.json();
        alert("Registration failed: " + result.error);
    }
}

// Login User
async function loginUser() {
    const data = {
        email: document.getElementById('loginEmail').value,
        password: document.getElementById('loginPassword').value
    };

    const res = await fetch('https://aahar-ai-xs0e.onrender.com/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
    });

    if (res.ok) {
        const result = await res.json();
        
        // Save session locally
        localStorage.setItem('token', result.token);
        localStorage.setItem('role', result.role);
        
        loadRoleBasedDashboard();
    } else {
        alert("Invalid email or password.");
    }
}

// Show correct button based on role
function loadRoleBasedDashboard() {
    const role = localStorage.getItem('role');
    
    if (!role) {
        showScreen('login');
        return;
    }

    showScreen('dashboard');

    if (role === 'donor') {
        document.getElementById('btn-donor-dashboard').classList.remove('hidden');
        document.getElementById('btn-ngo-dashboard').classList.add('hidden');
    } else if (role === 'ngo') {
        document.getElementById('btn-donor-dashboard').classList.add('hidden');
        document.getElementById('btn-ngo-dashboard').classList.remove('hidden');
    }
}

// Check session on page load
window.onload = () => {
    if (localStorage.getItem('token')) {
        loadRoleBasedDashboard();
    } else {
        showScreen('login');
    }
};
